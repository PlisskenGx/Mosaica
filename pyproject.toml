[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "mosaica"
dynamic = ["version"]
description = "Standalone physical tile mosaic generation engine"
requires-python = ">=3.11"

dependencies = [
    "Pillow>=10.0",
    "CairoSVG>=2.7"
]


[project.scripts]
mosaica = "mosaica.cli:main"


[tool.setuptools.package-data]
mosaica = ["web/*.html", "web/*.css", "web/*.js"]

[tool.setuptools.dynamic]
version = {attr = "mosaica.__version__"}

[tool.setuptools.packages.find]
include = ["mosaica*"]
