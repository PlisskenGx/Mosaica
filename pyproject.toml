[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "mosaic-engine"
dynamic = ["version"]
description = "Standalone physical tile mosaic generation engine"
requires-python = ">=3.11"

dependencies = [
    "Pillow>=10.0",
    "CairoSVG>=2.7"
]


[project.scripts]
mosaic-engine = "mosaic_engine.cli:main"


[tool.setuptools.package-data]
mosaic_engine = ["web/*.html", "web/*.css", "web/*.js"]

[tool.setuptools.dynamic]
version = {attr = "mosaic_engine.__version__"}
